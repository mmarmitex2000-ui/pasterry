<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sacola - Pasterry</title>
<style>
body{margin:0;font-family:Arial;background:#1A1210;color:#e6eef6;padding:16px;padding-bottom:180px}
h3{margin:0 0 12px;font-size:22px;color:#07fcdb}
.btn{padding:8px 12px;border:none;border-radius:10px;font-weight:bold;cursor:pointer}
.btn.primary{background:#28a745;color:#fff}
.btn.secondary{background:#E8F5E9;color:#1A1210}
.btn.danger{background:#dc3545;color:#fff}
.cart-item{display:flex;align-items:center;gap:10px;padding:8px;background:#2a201d;border-radius:8px;margin-bottom:8px}
.cart-item img{width:50px;height:50px;object-fit:cover;border-radius:6px}
.molhos{display:flex;overflow-x:auto;gap:8px;margin:10px 0}
.molho-card{flex:0 0 120px;background:#2a201d;border-radius:8px;padding:6px;text-align:center}
.molho-card img{width:100%;height:48px;object-fit:cover;border-radius:6px}
.totais{background:#2a201d;border-radius:10px;padding:12px}
#modalEndereco{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);justify-content:center;align-items:center;z-index:110}
.modal-content{background:#272323;padding:15px;border-radius:10px;width:320px;max-width:92vw;max-height:90vh;overflow:auto}
.modal-content input,.modal-content select{width:100%;padding:8px;margin:6px 0;border:1px solid #444;border-radius:8px;background:#1A1210;color:#e6eef6;box-sizing:border-box}
.cupom{background:#1A1210;border:1px dashed #444;padding:10px;margin:10px 0;font-size:13px}
.footer-actions{position:fixed;bottom:0;left:0;width:100%;background:#1A1210;padding:12px 16px;box-sizing:border-box}
.footer-buttons{display:flex;gap:12px}
.btn-large{padding:12px 16px;font-size:16px;flex:1}
.geo-btn{width:100%;padding:12px;background:linear-gradient(135deg,#28a745,#07fcdb);color:#000;border:none;border-radius:10px;font-weight:bold;margin:8px 0}
.geo-status{text-align:center;font-size:12px;min-height:16px;color:#07fcdb}
</style>
</head>
<body>

<h3>Molhos</h3><div class="molhos" id="molhos"></div>
<h3>Itens do Pedido</h3><div id="cart"></div>
<button class="btn danger" onclick="limparSacola()">Esvaziar sacola</button>

<div class="footer-actions">
<div id="totais"></div>
<div class="footer-buttons">
<button class="btn danger btn-large" onclick="location.href='index.html'">Voltar</button>
<button class="btn primary btn-large" onclick="abrirModal()">Confirmar</button>
</div></div>

<div id="modalEndereco"><div class="modal-content">
<button class="btn secondary" style="float:right" onclick="fecharModal()">X</button>
<h3>Seus dados</h3>
<button id="btnGeo" class="geo-btn" onclick="usarLocalizacao()">Usar minha localização</button>
<div id="geoStatus" class="geo-status"></div>
<input id="nome" placeholder="Nome completo*">
<input id="telefone" placeholder="WhatsApp com DDD*">
<select id="cidade"><option value="">Selecione sua cidade*</option></select>
<input id="rua" placeholder="Digite sua rua*">
<input id="numero" placeholder="Número*">
<input id="bairro" placeholder="Bairro*">
<select id="pagamento"><option value="">Forma de pagamento*</option><option>Debito</option><option>Credito</option><option>Dinheiro</option></select>
<input id="troco" placeholder="Troco para quanto?*" style="display:none">
<div class="cupom"><h4>Resumo</h4><div id="cupomItens"></div><div id="cupomTotal"></div></div>
<button class="btn primary" style="width:100%" onclick="enviarPedido()">Confirmar e Enviar</button>
</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, serverTimestamp, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyDV9tPC5XNNmB_REgW1au2NtpP1ETtV1i0", authDomain: "paineldepedidos-8cfff.firebaseapp.com", projectId: "paineldepedidos-8cfff" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let GOOGLE_KEY = localStorage.getItem('gmaps_key') || "AIzaSyDV9tPC5XNNmB_REgW1au2NtpP1ETtV1i0";
let taxaAtual = null, distanciaAtual = null, configEntrega = null;

const CART_KEY='pasterry_cart_v1';
const SAUCES={'Molho Barbecue':{img:'img/barbecue.jpg',price:5},'Molho Mostarda':{img:'img/mostarda.jpg',price:5},'Molho Cheddar':{img:'img/cheddar.jpg',price:5},'Molho Tartaro':{img:'img/tartaro.jpg',price:5},'Ketchup':{img:'img/ketchup.jpg',price:5}};

const getCart=()=>JSON.parse(localStorage.getItem(CART_KEY)||'[]');
const setCart=c=>localStorage.setItem(CART_KEY,JSON.stringify(c));
const money=v=>'R$ '+Number(v||0).toFixed(2).replace('.',',');
const distanciaKm=(a,b,c,d)=>{const R=6371,e=(c-a)*Math.PI/180,f=(d-b)*Math.PI/180;return R*2*Math.asin(Math.sqrt(Math.sin(e/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(f/2)**2))};

function calcularTaxa(km){ if(!configEntrega?.faixas) return null; const f=configEntrega.faixas.sort((a,b)=>a.ate-b.ate).find(x=>km<=x.ate); return f?Number(f.taxa):null; }

function calcularTaxaLocal(lat,lon){
  if(!configEntrega||!window.google) return null;
  const p=new google.maps.LatLng(lat,lon);
  if(configEntrega.areas){
    for(const a of configEntrega.areas){
      if(a.tipo==='polygon'&&a.path){
        try{ if(google.maps.geometry.poly.containsLocation(p,new google.maps.Polygon({paths:a.path}))){ distanciaAtual=distanciaKm(lat,lon,configEntrega.loja.lat,configEntrega.loja.lon); return Number(a.taxa); } }catch(e){}
      }
      if(a.tipo==='circle'&&a.center){
        if(distanciaKm(lat,lon,a.center.lat,a.center.lng)*1000<=a.raio){ distanciaAtual=distanciaKm(lat,lon,configEntrega.loja.lat,configEntrega.loja.lon); return Number(a.taxa); }
      }
    }
  }
  if(configEntrega.loja){ distanciaAtual=distanciaKm(lat,lon,configEntrega.loja.lat,configEntrega.loja.lon); return calcularTaxa(distanciaAtual); }
  return null;
}

async function carregar(){
  const snap=await getDoc(doc(db,"config","entrega"));
  configEntrega=snap.exists()?snap.data():{loja:{lat:-23.27824,lon:-46.73661},faixas:[{ate:5,taxa:5}],cidades:['Franco da Rocha']};
  if(configEntrega.googleMapsApiKey) GOOGLE_KEY=configEntrega.googleMapsApiKey;
  cidade.innerHTML='<option value="">Selecione sua cidade*</option>'+configEntrega.cidades.map(c=>`<option>${c}</option>`).join('');
  if(!window.google){ const s=document.createElement('script'); s.src=`https://maps.googleapis.com/maps/api/js?key=${GOOGLE_KEY}&libraries=places,geometry&loading=async`; s.async=true; document.head.appendChild(s); }
  renderTotais();
}

function debounce(fn,d){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),d)}}
async function calcularTaxaEndereco(){
  if(rua.value.length<3||!cidade.value) return;
  cupomTotal.innerHTML='Calculando taxa...';
  try{
    const end=`${rua.value}, ${numero.value}, ${cidade.value}`;
    const r=await fetch(`https://maps.googleapis.com/maps/api/geocode/json?address=${encodeURIComponent(end)}&key=${GOOGLE_KEY}`);
    const d=await r.json();
    if(d.results[0]){ const l=d.results[0].geometry.location; taxaAtual=calcularTaxaLocal(l.lat,l.lng); renderTotais(); renderCupom(); }
  }catch(e){}
}
const calcDebounced=debounce(calcularTaxaEndereco,700);

function renderMolhos(){molhos.innerHTML=Object.entries(SAUCES).map(([n,s])=>`<div class="molho-card"><img src="${s.img}"><div>${n}</div><div>${money(s.price)}</div><button class="btn primary" onclick="addMolho('${n}')">+</button></div>`).join('')}

function renderCart(){
  const c=getCart();
  cart.innerHTML=c.length?c.map((it,i)=>`
    <div class="cart-item">
      <img src="${it.img}">
      <div style="flex:1">${it.title}</div>
      <div style="display:flex;align-items:center;gap:6px">
        <button class="btn secondary" style="padding:4px 8px" onclick="alterarQtd(${i},-1)">-</button>
        <span>${it.qty}x</span>
        <button class="btn primary" style="padding:4px 8px" onclick="alterarQtd(${i},1)">+</button>
      </div>
    </div>`).join(''):'Sacola vazia';
  renderTotais()
}

function renderTotais(){const c=getCart();const sub=c.reduce((s,i)=>s+i.price*i.qty,0);totais.innerHTML=`Subtotal: ${money(sub)}<br>Entrega: ${taxaAtual!==null?money(taxaAtual):'—'}<br><b>Total: ${money(sub+(taxaAtual||0))}</b>`}
function renderCupom(){const c=getCart();cupomItens.innerHTML=c.map(i=>`${i.qty}x ${i.title}`).join('<br>');const sub=c.reduce((s,i)=>s+i.price*i.qty,0);cupomTotal.innerHTML=`Subtotal: ${money(sub)}<br>Entrega: <b style="color:#07fcdb">${taxaAtual!==null?money(taxaAtual):'digite o endereço'}</b><br><b>Total: ${money(sub+(taxaAtual||0))}</b>`}

window.addMolho=n=>{const c=getCart();const e=c.find(x=>x.id===n);if(e)e.qty++;else c.push({id:n,title:n,price:SAUCES[n].price,qty:1,img:SAUCES[n].img});setCart(c);renderCart()}

window.alterarQtd=(i,delta)=>{
  const c=getCart();
  if(!c[i]) return;
  c[i].qty += delta;
  if(c[i].qty <= 0) c.splice(i,1);
  setCart(c);
  renderCart();
  renderCupom();
}

window.limparSacola=()=>{localStorage.removeItem(CART_KEY);renderCart()}
window.abrirModal=()=>{modalEndereco.style.display='flex';renderCupom()}
window.fecharModal=()=>modalEndereco.style.display='none'
window.usarLocalizacao=()=>{navigator.geolocation.getCurrentPosition(async p=>{const {latitude:lat,longitude:lon}=p.coords;taxaAtual=calcularTaxaLocal(lat,lon);renderTotais();renderCupom();geoStatus.textContent='Taxa: '+money(taxaAtual)})}

// VALIDACAO OBRIGATORIA
window.enviarPedido=async()=>{
  const c=getCart();
  if(!c.length){ alert('Sua sacola está vazia'); return; }
  if(!nome.value.trim()){ alert('Preencha seu nome completo'); nome.focus(); return; }
  const tel = telefone.value.replace(/\D/g,'');
  if(tel.length < 10){ alert('Preencha WhatsApp com DDD'); telefone.focus(); return; }
  if(!cidade.value){ alert('Selecione sua cidade'); cidade.focus(); return; }
  if(!rua.value.trim()){ alert('Digite sua rua'); rua.focus(); return; }
  if(!numero.value.trim()){ alert('Digite o número'); numero.focus(); return; }
  if(!bairro.value.trim()){ alert('Digite o bairro'); bairro.focus(); return; }
  if(!pagamento.value){ alert('Selecione a forma de pagamento'); pagamento.focus(); return; }
  if(pagamento.value==='Dinheiro' &&!troco.value.trim()){ alert('Informe troco para quanto'); troco.focus(); return; }
  if(taxaAtual===null){ alert('Aguarde calcular a taxa de entrega'); return; }

  const pedido={
    id:'A'+Date.now(),
    cliente:{
      nome:nome.value.trim(),
      telefone:telefone.value.trim(),
      cidade:cidade.value,
      rua:rua.value.trim(),
      numero:numero.value.trim(),
      bairro:bairro.value.trim(),
      pagamento:pagamento.value,
      troco: pagamento.value==='Dinheiro'?troco.value.trim():''
    },
    itens:c,
    taxa:taxaAtual,
    distancia:distanciaAtual,
    total:c.reduce((s,i)=>s+i.price*i.qty,0)+(taxaAtual||0),
    status:'novo',
    criadoEm:serverTimestamp()
  };
  await setDoc(doc(db,"pedidos",pedido.id),pedido);

  // PARABÉNS PELA EXCELENTE ESCOLHA
  const primeiroNome = pedido.cliente.nome.split(' ')[0];
  alert(`Parabéns pela excelente escolha, ${primeiroNome}! 🎉\nSeu pedido #${pedido.id} foi confirmado com sucesso.`);

  localStorage.removeItem(CART_KEY);
  location.href='index.html'
}

carregar();renderMolhos();renderCart();
rua.addEventListener('input',calcDebounced);
numero.addEventListener('input',calcDebounced);
cidade.addEventListener('change',calcDebounced);
pagamento.addEventListener('change',()=>{ troco.style.display = pagamento.value==='Dinheiro'? 'block' : 'none'; });
</script>
</body>
</html>
